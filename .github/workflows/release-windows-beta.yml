name: Release Windows beta

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: attention-hub-beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    environment: updater-release
    env:
      CI: "true"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      # One native command per step, deliberately.
      #
      # GitHub's pwsh wrapper only exits with the *final* $LASTEXITCODE, and
      # $ErrorActionPreference does not govern native command exit codes. A step
      # running several commands therefore reports only the last one: a failing
      # `pnpm test` followed by a passing `pnpm run build` published anyway.
      # Keep these split, or check $LASTEXITCODE after every command.
      - name: Enable corepack
        shell: pwsh
        run: corepack enable

      - name: Activate pinned pnpm
        shell: pwsh
        run: corepack prepare pnpm@10.17.1 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and source versions
        shell: pwsh
        run: pnpm run verify:release-version -- $env:GITHUB_REF_NAME

      - name: Run frontend tests
        shell: pwsh
        run: pnpm test

      - name: Build frontend
        shell: pwsh
        run: pnpm run build

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build signed updater artifacts and publish prerelease
        id: tauri_release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Attention Hub ${{ github.ref_name }}"
          releaseBody: "Signed in-app updater artifacts are included. The Windows installer remains Authenticode-unsigned unless the release notes state otherwise."
          prerelease: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: pnpm tauri
          args: --bundles nsis

      - name: Verify and publish the stable beta feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Path updater-output -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --pattern latest.json --dir updater-output --clobber

          $feedPath = Resolve-Path updater-output/latest.json
          $feed = Get-Content -Raw -LiteralPath $feedPath | ConvertFrom-Json
          $expectedVersion = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($feed.version -ne $expectedVersion) {
            throw "Updater feed version $($feed.version) does not match $expectedVersion."
          }
          $windowsEntry = $feed.platforms.PSObject.Properties |
            Where-Object { $_.Name -like "windows-x86_64*" } |
            Select-Object -First 1
          if (-not $windowsEntry -or -not $windowsEntry.Value.url -or -not $windowsEntry.Value.signature) {
            throw "latest.json does not contain a signed Windows x64 updater artifact."
          }

          $repository = $env:GITHUB_REPOSITORY
          gh api "repos/$repository/git/ref/heads/updater-feed" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$repository/git/refs" `
              -f ref="refs/heads/updater-feed" `
              -f sha="$env:GITHUB_SHA" | Out-Null
          }

          $existingSha = gh api "repos/$repository/contents/latest-beta.json?ref=updater-feed" --jq .sha 2>$null
          $encodedFeed = [Convert]::ToBase64String([IO.File]::ReadAllBytes($feedPath))
          $arguments = @(
            "api", "--method", "PUT",
            "repos/$repository/contents/latest-beta.json",
            "-f", "message=Publish beta updater feed for $expectedVersion",
            "-f", "content=$encodedFeed",
            "-f", "branch=updater-feed"
          )
          if ($LASTEXITCODE -eq 0 -and $existingSha) {
            $arguments += @("-f", "sha=$existingSha")
          }
          & gh @arguments | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish latest-beta.json to updater-feed."
          }
