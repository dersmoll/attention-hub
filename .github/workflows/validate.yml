name: Validate

# The release workflow is tag-triggered, so before this existed the gates first
# ran at publication — the worst moment to discover a failure. This runs the
# same checks on every pull request and on main, and publishes nothing.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attention-hub-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Windows-only application: the Rust sources carry cfg(target_os = "windows")
    # paths, so a Linux runner would not compile the code that actually ships.
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      # One native command per step. See the note in release-windows-beta.yml:
      # a pwsh step reports only its final command's exit code.
      - name: Enable corepack
        shell: pwsh
        run: corepack enable

      - name: Activate pinned pnpm
        shell: pwsh
        run: corepack prepare pnpm@10.17.1 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        shell: pwsh
        run: pnpm test

      - name: Build frontend
        shell: pwsh
        run: pnpm run build

      - name: Check Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
